name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR/tag cancels the previous in-flight run so we
# don't pay for stale builds. Each tag ref is unique, so releases are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        # Full history + tags so the build can read the release version from `git describe`
        # (StampGitVersion in EmuShelf.App.csproj). A shallow clone would hide the tags.
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

  package:
    needs: build
    # Packaging is expensive; skip it on PRs (build + test still gate them) and only
    # produce artifacts on pushes to main, version tags, and manual runs.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        # Full history + tags so the build can read the release version from `git describe`
        # (StampGitVersion in EmuShelf.App.csproj). A shallow clone would hide the tags.
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Publish self-contained Windows build
        # Application-identity credentials are baked in here (see Build/EmbeddedSecrets.targets). They
        # are only available on same-repo events, so fork PR builds simply ship without them.
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
          SCREENSCRAPER_SOFTNAME: ${{ secrets.SCREENSCRAPER_SOFTNAME }}
          EMUSHELF_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.EMUSHELF_GOOGLE_OAUTH_CLIENT_ID }}
          EMUSHELF_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.EMUSHELF_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: >-
          dotnet publish src/EmuShelf.App
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishReadyToRun=true
          -p:PublishReadyToRunShowWarnings=true
          -o publish/EmuShelf
      - name: Verify portable payload
        shell: pwsh
        run: |
          $required = @(
            'publish/EmuShelf/EmuShelf.exe',
            'publish/EmuShelf/THIRD-PARTY-NOTICES.md',
            'publish/EmuShelf/ThirdParty/OpenEmu/LICENSE.txt'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Portable payload is missing $path"
            }
          }
      - name: Create portable zip and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path publish/EmuShelf -DestinationPath artifacts/EmuShelf-win-x64.zip
          $hash = (Get-FileHash artifacts/EmuShelf-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  EmuShelf-win-x64.zip" | Set-Content artifacts/EmuShelf-win-x64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: EmuShelf-win-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  package-appimage:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history + tags so the build can read the release version from `git describe`
        # (StampGitVersion in EmuShelf.App.csproj). A shallow clone would hide the tags.
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Install AppImage bundling dependencies
        # build-appimage.sh copies the resolved libICE/libSM (and libicu) from the runner via
        # ldconfig, so they must be installed here for the bundle step to find them.
        run: sudo apt-get update && sudo apt-get install -y libice6 libsm6
      - name: Publish self-contained Linux build
        # Application-identity credentials are baked in here (see Build/EmbeddedSecrets.targets); this
        # is the build the Steam Deck runs. Absent secrets (fork PRs) just ship without them.
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
          SCREENSCRAPER_SOFTNAME: ${{ secrets.SCREENSCRAPER_SOFTNAME }}
          EMUSHELF_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.EMUSHELF_GOOGLE_OAUTH_CLIENT_ID }}
          EMUSHELF_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.EMUSHELF_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: >-
          dotnet publish src/EmuShelf.App -c Release -r linux-x64 --self-contained true
          -p:InvariantGlobalization=false -o publish/EmuShelf
      - name: Build and validate AppImage
        run: |
          curl -L -o /tmp/appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage packaging/appimage/build-appimage.sh
          sudo ln -s /tmp/appimagetool.AppImage /usr/local/bin/appimagetool
          mkdir -p artifacts
          packaging/appimage/build-appimage.sh publish/EmuShelf artifacts/EmuShelf-linux-x64.AppImage
          chmod +x artifacts/EmuShelf-linux-x64.AppImage
          artifacts/EmuShelf-linux-x64.AppImage --appimage-extract-and-run --version
          sha256sum artifacts/EmuShelf-linux-x64.AppImage > artifacts/EmuShelf-linux-x64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: EmuShelf-linux-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  package-macos:
    needs: build
    if: github.event_name != 'pull_request'
    # macos-latest runners are Apple Silicon, so we build the arm64 slice. Intel Macs
    # would need a second osx-x64 artifact (or a universal binary) — see the PR notes.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        # Full history + tags so the build can read the release version from `git describe`
        # (StampGitVersion in EmuShelf.App.csproj). A shallow clone would hide the tags.
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Publish self-contained macOS build
        # Application-identity credentials are baked in here (see Build/EmbeddedSecrets.targets).
        # Absent secrets (fork PRs) just ship without them.
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
          SCREENSCRAPER_SOFTNAME: ${{ secrets.SCREENSCRAPER_SOFTNAME }}
          EMUSHELF_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.EMUSHELF_GOOGLE_OAUTH_CLIENT_ID }}
          EMUSHELF_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.EMUSHELF_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: >-
          dotnet publish src/EmuShelf.App -c Release -r osx-arm64 --self-contained true
          -p:InvariantGlobalization=false -o publish/mac
      - name: Assemble .app bundle
        run: |
          chmod +x packaging/macos/build-macos-app.sh
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0-dev"; fi
          mkdir -p artifacts
          packaging/macos/build-macos-app.sh publish/mac artifacts/EmuShelf.app "$version"
      - name: Verify portable payload
        run: |
          app="artifacts/EmuShelf.app/Contents/MacOS"
          for f in EmuShelf THIRD-PARTY-NOTICES.md ThirdParty/OpenEmu/LICENSE.txt; do
            if [ ! -e "$app/$f" ]; then echo "Portable payload is missing $f"; exit 1; fi
          done
          test -x "$app/EmuShelf" || { echo "EmuShelf is not executable"; exit 1; }
      - name: Package .app and checksum
        run: |
          # ditto preserves the bundle's permissions and symlinks (plain zip does not).
          ditto -c -k --sequesterRsrc --keepParent artifacts/EmuShelf.app artifacts/EmuShelf-macos-arm64.zip
          rm -rf artifacts/EmuShelf.app
          ( cd artifacts && shasum -a 256 EmuShelf-macos-arm64.zip > EmuShelf-macos-arm64.sha256 )
      - uses: actions/upload-artifact@v4
        with:
          name: EmuShelf-macos-arm64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  package-android:
    needs: build
    # The Android head (src/EmuShelf.App.Android) is experimental and lives OUTSIDE EmuShelf.slnx, so
    # `dotnet build`/`dotnet test` in the `build` job never compile it — this job is the build floor that
    # keeps it from silently rotting (a shared-interface change that breaks the head fails here, not at
    # deploy time). It runs on PRs too, but uploads the APK only on non-PR events. The `release` job lists
    # this job in `needs` so a tagged release WAITS for and attaches the APK, but the release's own `if`
    # only *requires* the three desktop packages — so a broken experimental APK is left off the release
    # rather than blocking the Windows/macOS/Linux release. See the `release` job's comment.
    runs-on: ubuntu-latest
    # Hoisted to job level so the decode/sign steps can gate on `env.ANDROID_KEYSTORE_BASE64 != ''`
    # (a step cannot read `secrets.*` in its own `if`). Absent (fork PRs, or before the keystore is
    # configured) the build simply debug-key-signs, exactly as before.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        # JDK 21 is required by Avalonia.Android 12.1.0's AndroidX AppCompat/Window bindings (plan's
        # Development-setup table). The runner's Temurin JDK has the `release` file the .NET Android SDK
        # probes for, so no JavaSdkDirectory workaround is needed here (that trap is Homebrew-specific).
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-android-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-android-
      - name: Install the Android workload
        # Minutes on a cold cache, per the plan; the NuGet cache above does not cover the workload packs.
        run: dotnet workload install android
      - name: Install Android SDK platform 36 + build-tools + NDK
        # Avalonia.Android 12.1.0 ships only lib/net10.0-android36.0, so platform 36 is the floor.
        # The NDK is required because Release enables RunAOTCompilation (DECISIONS 2026-08-30): AOT is the
        # single biggest couch-performance win on the AYN Thor (halves the grid-scroll stalls, removes the
        # All-Games ANR), but it compiles the managed code to native and so needs the NDK toolchain. The
        # version is the Microsoft.Android.Sdk 36.1.69 default (AndroidNdkVersion), which .NET auto-locates
        # under $ANDROID_HOME/ndk. AOT makes this job notably slower and the APK larger — expected.
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;26.3.11579264"
      - name: Decode the release keystore
        # Only when the keystore secret is configured. Written to RUNNER_TEMP (outside the workspace,
        # never committable), and removed at job end with the runner.
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build the Android APK
        # Application-identity credentials are baked in via Build/EmbeddedSecrets.targets, exactly as the
        # desktop package jobs do; absent secrets (fork PRs) just ship without them.
        #
        # Signing: when the ANDROID_KEYSTORE_* secrets are configured the APK is signed with the stable
        # release keystore, so every build shares one signature and installs as an in-place upgrade. The
        # passwords are passed as `env:VAR` (a .NET Android feature) so they never appear on the command
        # line or in logs. When the secret is absent the build debug-key-signs as before (installable via
        # sideload, but the ephemeral key blocks in-place upgrades). Setup runbook: see DECISIONS 2026-08-20.
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
          SCREENSCRAPER_SOFTNAME: ${{ secrets.SCREENSCRAPER_SOFTNAME }}
          EMUSHELF_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.EMUSHELF_GOOGLE_OAUTH_CLIENT_ID }}
          EMUSHELF_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.EMUSHELF_GOOGLE_OAUTH_CLIENT_SECRET }}
          ANDROID_SIGNING_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          sign_args=()
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            sign_args=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore"
              -p:AndroidSigningKeyAlias="$ANDROID_SIGNING_KEY_ALIAS"
              -p:AndroidSigningStorePass=env:ANDROID_SIGNING_STORE_PASS
              -p:AndroidSigningKeyPass=env:ANDROID_SIGNING_KEY_PASS
            )
          fi
          # Derive the version from git so a new tag alone bumps the app — no csproj edit per release.
          # versionCode (the integer Android compares for "is this an upgrade") is the commit count, which
          # increases monotonically with every commit, so it is always higher than the last release's.
          # versionName (the human string) is the tag on a tag build (v1.5.0 -> 1.5.0), else `git describe`.
          # The checkout above uses fetch-depth: 0, so full history/tags are present. These override the
          # csproj defaults (which only matter for local dev builds).
          version_code="$(git rev-list --count HEAD)"
          version_name="$(git describe --tags --always 2>/dev/null | sed 's/^v//')"
          [ -n "$version_name" ] || version_name="0.0.0"
          echo "Android version: code=$version_code name=$version_name"
          dotnet publish src/EmuShelf.App.Android/EmuShelf.App.Android.csproj \
            -c Release \
            -p:ApplicationVersion="$version_code" \
            -p:ApplicationDisplayVersion="$version_name" \
            -p:AndroidPackageFormat=apk \
            -p:JavaSdkDirectory="$JAVA_HOME" \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            "${sign_args[@]}" \
            -o publish/android
      - name: Collect the APK
        run: |
          mkdir -p artifacts
          apk="$(find publish/android -name '*-Signed.apk' -print -quit)"
          if [ -z "$apk" ]; then apk="$(find publish/android bin -name '*.apk' -print -quit)"; fi
          if [ -z "$apk" ]; then echo "No APK was produced"; exit 1; fi
          cp "$apk" artifacts/EmuShelf-android-arm64.apk
          sha256sum artifacts/EmuShelf-android-arm64.apk > artifacts/EmuShelf-android-arm64.sha256
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: EmuShelf-android
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    # On a version tag (vX.Y.Z), collect every platform artifact and publish a
    # GitHub Release so builds are permanent and downloadable, not 14-day artifacts.
    # package-android is in `needs` so the release WAITS for the APK and attaches it,
    # but the `if` only *requires* the three desktop packages to have succeeded (plus
    # !cancelled() to override the implicit success() gate). So a broken experimental
    # APK build no longer blocks the desktop release — it is simply left off, while a
    # successful one is included. This keeps the plan's "don't let Android block a
    # release" guarantee while still shipping the APK when it builds.
    needs: [package, package-appimage, package-macos, package-android]
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !cancelled() &&
      needs.package.result == 'success' &&
      needs.package-appimage.result == 'success' &&
      needs.package-macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
