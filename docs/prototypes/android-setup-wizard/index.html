<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>EmuShelf Android setup wizard — A/B prototype</title>
<style>
@font-face{font-family:"Exo 2";src:url(../../../src/EmuShelf.UI/Assets/Fonts/Exo2.ttf)}
:root{--panel:#2b3f39;--rail:#0c1512;--row:#1e332c;--rowf:#425834;--well:#3d544c;--acc:#a8cd40;--acc2:#c3e04c;--txt:#dff2e6;--sec:#afcabc;--ter:#86a294;--warn:#f0ae54;--bad:#ff6673;--ok:#70d3a4;--dim:#4f645c}
*{box-sizing:border-box}html,body{margin:0;background:#070b09;color:#ddd;font-family:"Exo 2",system-ui,sans-serif}
#top{display:flex;gap:8px;align-items:center;padding:10px 16px;background:#101714;border-bottom:1px solid #1f2b27;flex-wrap:wrap}
#top .tab{padding:8px 14px;border-radius:8px;background:#1d2925;color:#cfd;cursor:pointer;font-size:14px}#top .tab.on{background:var(--acc2);color:#16220e;font-weight:700}
#top .flip{margin-left:auto;display:flex;border-radius:8px;overflow:hidden;border:1px solid #345}#top .flip div{padding:8px 16px;cursor:pointer;font-size:14px;color:#bcc}#top .flip div.on{background:#e8f0ea;color:#111;font-weight:700}
#hint{font-size:12px;color:#8a9;padding:6px 16px}
#stagewrap{position:relative;margin:0 auto}#stage{width:1920px;height:1080px;position:relative;transform-origin:0 0;overflow:hidden;background:#070707;cursor:pointer}
#stage img.shot{position:absolute;inset:0;width:100%;height:100%}
#notes{max-width:1100px;margin:16px auto 40px;padding:0 16px;color:#cdd;font-size:14px;line-height:1.5}#notes h3{margin:0 0 6px;font-size:15px;color:#fff}#notes ul{margin:0;padding-left:18px}
.bg{position:absolute;inset:0;background:url(assets/shelf-bg.jpg) center/cover;filter:brightness(.22)}
.panel{position:absolute;left:57px;top:57px;width:1806px;height:967px;border-radius:30px;background:var(--panel);border:2px solid rgba(255,255,255,.07)}
.rail{position:absolute;left:46px;top:75px;width:412px;height:756px;border-radius:22px;background:var(--rail);padding:26px 22px 0}
.rail h1{margin:0;font-size:44px;font-weight:600;color:var(--txt);line-height:1.1}
.rail .div{height:2px;background:#263f38;margin:18px 0 16px}
.ri{height:66px;margin:0 0 8px;border-radius:14px;display:flex;align-items:center;padding:0 22px 0 26px;color:var(--txt);font-size:24px;font-weight:600;position:relative}
.ri .s{font-size:16.5px;font-weight:500;color:var(--ter);margin-top:1px}
.ri .s.ok{color:var(--ok)}.ri .s.warn{color:var(--warn)}
.ri.dim{color:var(--dim)}.ri.dim .s{color:#3f5049}
.ri.cur{border:3px solid var(--acc);color:var(--acc2);padding-left:44px}
.ri.cur::before{content:"";position:absolute;left:24px;top:50%;width:5px;height:26px;margin-top:-13px;border-radius:3px;background:var(--acc)}
.ri.cur .s{color:var(--sec)}
.start{position:absolute;left:24px;bottom:24px;width:364px;height:76px;border-radius:16px;background:var(--row);border:2px solid #3a5a4e;display:flex;align-items:center;gap:16px;padding:0 22px}
.start.dis{opacity:.45}
.start .chip{background:#1f3640;border:2px solid #3f6a7a;color:#dff2e6;font-size:17px;font-weight:700;padding:7px 12px;border-radius:9px;letter-spacing:.04em}
.start .t{font-size:24px;font-weight:600;color:var(--txt);line-height:1.05}.start .t small{display:block;font-size:19px;font-weight:500;color:var(--sec)}
.content{position:absolute;left:505px;top:75px;width:1228px}
.content h2{margin:0;font-size:44px;font-weight:600;color:var(--txt);line-height:1.05}
.content .d{font-size:23px;color:var(--sec);margin:6px 0 0}
.clip{position:absolute;left:505px;top:175px;width:1228px;height:660px;overflow:hidden}
.rows{display:flex;flex-direction:column;gap:14px}
.row{min-height:100px;border-radius:18px;background:var(--row);display:flex;align-items:center;padding:0 28px 0 30px;color:var(--txt);position:relative}
.row.f{background:var(--rowf);outline:3px solid var(--acc);outline-offset:-3px}
.row.dis{opacity:.42}
.row .well{width:62px;height:62px;border-radius:12px;background:var(--well);display:flex;align-items:center;justify-content:center;flex:none;margin:0 26px 0 -3px}
.row .well img{width:44px;height:44px}
.row .lab{flex:1;min-width:0}
.row .lab .l{font-size:26px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .lab .dd{font-size:20.5px;color:var(--ter);margin-top:5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.f .lab .dd{color:#c9d6bf}
.row .lab .dd .w{color:var(--warn);font-weight:600}.row .lab .dd .ok{color:var(--ok);font-weight:600}
.row .val{display:flex;align-items:center;gap:22px;margin-left:24px;flex:none}
.row .val .txt{font-size:22px;font-weight:500;color:var(--ter)}
.row .val .arr{font-size:34px;color:var(--acc);line-height:1}
.row .val .choice{font-size:22px;font-weight:600;min-width:200px;text-align:center}
.circ{width:70px;height:70px;border-radius:50%;background:var(--acc);color:#16220e;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center}
.circ.mut{background:#3d544c;color:var(--sec)}.circ.ok{background:var(--ok);color:#0c2312}
.tog{width:205px;height:64px;border-radius:32px;background:#3a566d;display:flex;align-items:center;padding:3px;position:relative}
.tog i{width:58px;height:58px;border-radius:50%;background:#86a294;display:block}
.tog span{position:absolute;right:22px;font-size:19px;font-weight:700;color:var(--txt);letter-spacing:.03em}
.tog.on{background:#4f6d33}.tog.on i{background:var(--acc);margin-left:auto}.tog.on span{right:auto;left:22px}
.sum{height:84px;border-radius:18px;background:var(--row);display:flex;align-items:center;gap:20px;padding:0 28px 0 27px;color:var(--txt);font-size:25px;font-weight:600}
.sum .w{width:60px;height:60px;border-radius:12px;background:var(--well);display:flex;align-items:center;justify-content:center;flex:none}.sum .w img{width:44px;height:44px}
.sum .n{flex:1;white-space:nowrap}
.sum .m{font-size:20.5px;font-weight:500;color:var(--ter);white-space:nowrap}
.sum .m .w2{color:var(--warn);font-weight:600}
.sum .chev{font-size:30px;color:var(--acc);width:26px;text-align:center;margin-left:4px}
.sum.f{background:var(--rowf);outline:3px solid var(--acc);outline-offset:-3px}.sum.f .m{color:#c9d6bf}
.legend{position:absolute;left:43px;top:887px;display:flex;gap:26px;align-items:center;font-size:24px;color:#aac9bd}
.legend .k{display:inline-flex;align-items:center;gap:12px}
.chip{display:inline-flex;align-items:center;justify-content:center;height:36px;min-width:36px;padding:0 12px;border-radius:10px;background:#435550;color:#e8f2ec;font-weight:700;font-size:19px}
.chip.a{background:#5da379;color:#0c2312;border-radius:50%;width:36px;padding:0}.chip.b{background:#e57a8a;color:#3a0d14;border-radius:50%;width:36px;padding:0}.chip.y{background:#e6c650;color:#3a2f06;border-radius:50%;width:36px;padding:0}
.fade{position:absolute;left:505px;width:1228px;top:790px;height:44px;background:linear-gradient(transparent,var(--panel))}
.note{position:absolute;left:505px;top:770px;width:1228px;font-size:20.5px;color:var(--ter);line-height:1.35}
</style></head><body>
<div id="top"><span id="tabs"></span><div class="flip"><div id="f0">Current</div><div id="f1">Proposed</div></div></div>
<div id="hint">Click the screen or press <b>Space</b> to flip Current ↔ Proposed; <b>←/→</b> switch steps. Add <code>?s=N&amp;bare=1</code> for a bare 1920×1080 render.</div>
<div id="stagewrap"><div id="stage"></div></div>
<div id="notes"></div>
<script>
// The rail lists every step of setup. Phase A steps (storage, data folder) run before the app can boot;
// phase B steps run inside the composed app and are dimmed until the folder is set.
const STEPS=[['Storage access'],['Data folder'],['Second screen'],['Closing games'],['Game folders'],['Emulators'],['Saves']];
function rail(cur, status, opts={}){
  const items=STEPS.map(([l],i)=>{
    const st=status[i]||{};
    const cls=i===cur?'cur':(st.dim?'dim':'');
    return `<div class="ri ${cls}"><div><div>${l}</div><div class="s ${st.cls||''}">${st.t||''}</div></div></div>`;
  }).join('');
  const start=opts.start===false?'':`<div class="start ${opts.startDis?'dis':''}"><span class="chip">START</span><div class="t">${opts.startT||'Continue'}<small>${opts.startS||'Next step'}</small></div></div>`;
  return `<div class="rail"><h1>Setup</h1><div class="div"></div>${items}${start}</div>`;
}
const legend=items=>`<div class="legend">${items.map(([c,l])=>`<span class="k"><span class="chip ${c.length===1?c.toLowerCase():''}">${c}</span>${l}</span>`).join('')}</div>`;
function row(o){
  const well=o.sys?`<div class="well"><img src="assets/icons/${o.sys}.png"></div>`:'';
  let v='';
  if(o.toggle!==undefined) v=`<div class="tog ${o.toggle?'on':''}"><i></i><span>${o.toggle?o.on:o.off}</span></div>`;
  else if(o.choice) v=`<span class="arr">‹</span><span class="choice">${o.choice}</span><span class="arr">›</span>`;
  else if(o.act) v=`${o.txt?`<span class="txt">${o.txt}</span>`:''}<div class="circ ${o.mut?'mut':''} ${o.ok?'ok':''}">${o.act}</div>`;
  else if(o.txt) v=`<span class="txt">${o.txt}</span>`;
  return `<div class="row ${o.f?'f':''} ${o.dis?'dis':''}">${well}<div class="lab"><div class="l">${o.l}</div>${o.d?`<div class="dd">${o.d}</div>`:''}</div><div class="val">${v}</div></div>`;
}
const sum=(sys,name,meta,o={})=>`<div class="sum ${o.f?'f':''}"><div class="w"><img src="assets/icons/${sys}.png"></div><div class="n">${name}</div><div class="m">${meta}</div><div class="chev">›</div></div>`;
const page=(cur,status,title,desc,body,leg,opts={},note='')=>`<div class="bg"></div><div class="panel">${rail(cur,status,opts)}<div class="content"><h2>${title}</h2><div class="d">${desc}</div></div><div class="clip"><div class="rows">${body}</div></div>${note?`<div class="note">${note}</div>`:'<div class="fade"></div>'}${legend(leg)}</div>`;

// Rail status vocabularies. Phase A: everything after the folder is dimmed with no status.
const A0=[{t:'Not granted',cls:'warn'},{},{dim:1},{dim:1},{dim:1},{dim:1},{dim:1}];
const A1=[{t:'Granted',cls:'ok'},{},{dim:1},{dim:1},{dim:1},{dim:1},{dim:1}];
const B=(i,extra={})=>{
  const s=[{t:'Granted',cls:'ok'},{t:'User/EmuShelf',cls:'ok'},{t:'Off',cls:'warn'},{t:''},{t:''},{t:''},{t:''}];
  Object.assign(s,extra);
  for(let k=i+1;k<7;k++) if(!extra[k]) s[k]={t:''};
  return s;
};

const S=[
 {name:'1 · Storage access',shot:'current/onboarding.jpg',
  html:()=>page(0,A0,'Storage access','EmuShelf needs to read your games and keep its library on this device\'s storage. Android asks you to allow this once.',
   row({l:'Allow access to all files',d:'<span class="w">Not allowed yet</span> · A opens Android\'s permission page for EmuShelf',act:'›',f:true})+
   row({l:'What this is used for',d:'Reading your games where they are, and writing only inside EmuShelf\'s own folder. Games are never moved or deleted.',txt:''}),
   [['A','Open']],{startDis:true,startS:'Allow access first'}),
  notes:['Same panel, rail, rows and legend as Settings — one visual language across the app instead of the standalone card.','The rail is the progress indicator: every step is visible, done steps show their outcome, steps that need the app booted (Second screen onwards) are dimmed until the folder is set.','One row per decision. The "what EmuShelf touches" row replaces the small grey footnote and reads at couch size.','START is the only way forward, exactly like Save and close in Settings; it is disabled with a reason until the grant is held. Coming back from Android settings re-checks the grant and flips the row to Granted on its own.']},
 {name:'2 · Data folder (after reinstall)',shot:'current/onboarding.jpg',
  html:()=>page(1,A1,'Data folder','Where EmuShelf keeps its library, covers, settings and saves. Your game files are never moved.',
   row({l:'Use your existing library',d:'<span class="ok">Found</span> /storage/emulated/0/User/EmuShelf · 981 games · last used today',act:'›',f:true})+
   row({l:'Create a new folder here',d:'/storage/emulated/0/EmuShelf on this device\'s storage',act:'›',mut:true})+
   row({l:'Pick another folder',d:'Android\'s folder picker · Download, Documents and the top level can\'t be picked',act:'›',mut:true}),
   [['A','Select'],['B','Back']],{startDis:true,startS:'Pick a folder first'}),
  notes:['A reinstall no longer looks like a first run: the pointer mirror on shared storage (PR #231) and a scan of known roots surface the existing library as the first, focused row. One press and you are back.','On a genuine first run this row is absent and the recommended folder is focused instead.','The picker’s refusals (Download, Documents, root) are stated on the row, not discovered after a failed pick.','After this step the app composes in-process and the rail’s remaining steps light up; no process restart, no flash.']},
 {name:'3 · Second screen',shot:'current/onboarding.jpg',
  html:()=>page(2,B(2),'Playing on the second screen','This device has a second screen. A game can run there while the library stays here.',
   row({l:'Bring EmuShelf back when a game closes',d:'<span class="w">Off</span> · needs Android\'s accessibility permission · A opens that page',act:'›',f:true})+
   row({l:'What EmuShelf can see',d:'Only which app is open on the second screen. Never what it shows.',txt:''}),
   [['A','Open'],['B','Back']],{startT:'Continue',startS:'Games stay on this screen'}),
  notes:['Shown only on a device with a second screen (today: the Thor). Plain words instead of “second-screen return” and “watcher”: the row says what happens (EmuShelf comes back when the game closes) and what it needs (an accessibility permission).','Not a hard gate anymore: START continues with second-screen launches disabled (the launch path already refuses an external launch while the watcher is off). The status line says what continuing without it means.','Returning from Accessibility settings re-reads the switch; the row flips to On and the rail status turns green.']},
 {name:'4 · Closing games',shot:'current/emulators.jpg',
  html:()=>page(3,B(3,{2:{t:'On',cls:'ok'}}),'Closing games','What happens to the emulator when you come back to EmuShelf from a game.',
   row({l:'Close the emulator when I come back',d:'<span class="w">Needs Shizuku, which is not running</span> · start Shizuku, then press Y to allow',toggle:true,on:'CLOSE',off:'KEEP',f:true})+
   row({l:'Why Shizuku',d:'Android does not let one app close another. Shizuku is a small helper that can. Without it the emulator keeps running in the background.',txt:''}),
   [['A','Switch'],['Y','Allow'],['B','Back']]),
  notes:['Was “Emulator return”. Today this toggle lives in Settings and silently does nothing until Shizuku is allowed (a toast after a launch is the only hint). As a step it is asked once, with the reason on the row and Y to allow.','Optional: Y skips, and the rail records "Skipped" so it is obvious later where to come back to.']},
 {name:'5 · Game folders',shot:'current/library.jpg',
  html:()=>page(4,B(4,{2:{t:'On',cls:'ok'},3:{t:'Keep'}}),'Game folders','The folders your games are in. Each folder holds one system. Nothing inside is changed.',
   row({sys:'playstation2',l:'/storage/AE6A-1092/roms/ps2',d:'PlayStation 2 · 234 games found · Y removes it from the list',act:'↻'})+
   row({sys:'psp',l:'/storage/AE6A-1092/roms/psp',d:'PSP · 65 games found · Y removes it from the list',act:'↻'})+
   row({l:'Add game folder',d:'Pick a folder, then say which system it holds',act:'+',mut:true,f:true}),
   [['A','Add'],['Y','Remove'],['B','Back']],{startS:'2 folders · 299 games'}),
  notes:['The first thing a new user actually wants to do, brought forward from Settings → Emulators → per-platform → Add game folder.','Same folder row as Settings round 4 (A rescans, Y forgets, count on the line). START shows the running total so continuing feels earned.','Optional: an empty list is fine; the library then opens with the empty-state prompt it has today.']},
 {name:'6 · Emulators',shot:'current/emulators.jpg',
  html:()=>page(5,B(5,{2:{t:'On',cls:'ok'},3:{t:'Keep'},4:{t:'2 folders'}}),'Emulators','Which app plays each system. EmuShelf checked what is installed on this device.',
   sum('playstation2','PlayStation 2','<span class="w2">PCSX2 is not installed</span> · ARMSX2 is · 234 games',{f:true})+
   sum('psp','PSP','PPSSPP · 65 games'),
   [['A','Change'],['B','Back']],{startS:'1 needs attention'}),
  notes:['Only systems with games appear, so a two-folder library shows two rows, not fifteen.','Detection happens up front: the PS2-set-to-PCSX2 mistake that Settings surfaces after the fact is caught here, with the installed alternative named.','A opens the same choice row as Settings; nothing new to learn.']},
 {name:'7 · Saves',shot:'current/saves.jpg',
  html:()=>page(6,B(6,{2:{t:'On',cls:'ok'},3:{t:'Keep'},4:{t:'2 folders'},5:{t:'1 warning',cls:'warn'}}),'Saves','Back up emulator saves through your own Google Drive, and tell EmuShelf where each emulator keeps them.',
   row({l:'Google Drive',d:'Not connected · A opens the sign-in page in your browser',act:'›',f:true})+
   row({l:'Sync save states too',d:'In-game saves always sync · save states need the same emulator version on both devices',toggle:false,on:'SYNC',off:'SKIP'})+
   row({sys:'playstation2',l:'PlayStation 2 memory cards',d:'ARMSX2\'s default folder · only single-file .ps2 memory cards can sync',act:'›',mut:true})+
   row({sys:'psp',l:'PSP saves',d:'PPSSPP memory stick · not set · A picks the folder',act:'›',mut:true}),
   [['A','Connect'],['Y','Skip step'],['B','Back']],{startT:'Finish',startS:'Open the library'}),
  notes:['The per-system save folders are the manual selections the sync model needs (DS → WatermelonDS folder, PS2 → single-file cards); asking for them once here beats a silent "6 saves were not synced" in settings.json later.','Only systems from step 5 appear. Y skips the whole step; every row is reachable again in Settings → Saves.','START becomes Finish on the last step and opens the library. Completion is stored with a setup version, so a step added in a later release is shown once on its own, not the whole wizard again.']},
];

const params=new URLSearchParams(location.search);let cur=+(params.get('s')||0), flip=+(params.get('flip')||0);
const bare=params.get('bare')==='1';
function render(){
  const s=S[cur];
  document.getElementById('stage').innerHTML= flip===0?`<img class="shot" src="${s.shot}">`:s.html();
  document.getElementById('tabs').innerHTML=S.map((x,i)=>`<span class="tab ${i===cur?'on':''}" onclick="cur=${i};render()">${x.name}</span>`).join('');
  document.getElementById('f0').className=flip===0?'on':'';document.getElementById('f1').className=flip===1?'on':'';
  document.getElementById('notes').innerHTML=`<h3>${s.name} — what changes</h3><ul>${s.notes.map(n=>`<li>${n}</li>`).join('')}</ul>`;
  fit();
}
function fit(){const w=Math.min(window.innerWidth,1920);const k=w/1920;const st=document.getElementById('stage');st.style.transform=`scale(${k})`;document.getElementById('stagewrap').style.height=(1080*k)+'px';document.getElementById('stagewrap').style.width=w+'px';}
document.getElementById('stage').onclick=()=>{flip=1-flip;render()};
document.getElementById('f0').onclick=()=>{flip=0;render()};document.getElementById('f1').onclick=()=>{flip=1;render()};
window.onkeydown=e=>{if(e.key===' '){flip=1-flip;render();e.preventDefault()}if(e.key==='ArrowRight'){cur=(cur+1)%S.length;render()}if(e.key==='ArrowLeft'){cur=(cur+S.length-1)%S.length;render()}};
window.onresize=fit;
if(bare){document.getElementById('top').remove();document.getElementById('hint').remove();document.getElementById('notes').remove();document.getElementById('stage').style.transform='none';flip=params.has('flip')?flip:1;}
render();
</script>
</body></html>
